  @media(max-width:640px){.logo-marquee{margin:18px 0 22px;}.logo-item{width:128px;height:54px;padding:0 10px;}.prose .logo-item img{height:28px;max-width:104px;}.prose .logo-item img[src="victory-group.webp"],.prose .logo-item img[src="s7.svg"]{height:34px;max-width:64px;}}
  @media(prefers-reduced-motion:reduce){.logo-marquee{overflow:visible;mask-image:none;-webkit-mask-image:none;}.logo-track{animation:none;flex-wrap:wrap;justify-content:center;width:100%;}}

      fab._rt = setTimeout(function() { fab.classList.remove('rippling'); }, 2000);
    }
    setInterval(rippleFab, 10000);
    if (hintEl) hintEl.addEventListener('click', function() {
      hideHint();
      if (!panel.classList.contains('open')) openPanel();
    });
  }

  renderTOC();
  updateProgress();
  injectCollectionLd();
  if (ARTICLES.length === 0) {
    articleEl.innerHTML = '<div style="padding:40px;text-align:center;color:#888;">Статьи не загрузились. Проверьте консоль (F12).</div>';
  } else {
    var initial = null;
    try {
      var hashId = decodeURIComponent((location.hash || '').replace(/^#/, ''));
      if (hashId) initial = findArticle(hashId);
    } catch (e) {}
    if (!initial) {
      for (var i = 0; i < ARTICLES.length; i++) { if (!readSet[ARTICLES[i].id]) { initial = ARTICLES[i]; break; } }
    }
    if (!initial) initial = ARTICLES[0];
    selectArticle(initial.id);
  }
  initAssistant();
})();
</script>
</body>
</html>
